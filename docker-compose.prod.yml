# Production stack for a single host. Configure in .env (copy .env.prod.example), then:
#   docker compose build && docker compose up -d
# (.env sets COMPOSE_FILE=docker-compose.prod.yml.) Step-by-step guide: docs/DEPLOY.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-db-env: &db-env
  PGHOST: db
  PGUSER: kite
  PGDATABASE: kite
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://kite:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/kite
  # With BASE_PATH (e.g. /tasks) the app lives under that path: cookie path and invite links.
  WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}${BASE_PATH:-}
  # Caddy is the one proxy in front.
  TRUST_PROXY: '1'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_DOCS: ${API_DOCS:-false}
  REPORTS_CACHE_TTL_MS: ${REPORTS_CACHE_TTL_MS:-300000}
  MAX_WORKSPACE_STORAGE_BYTES: ${MAX_WORKSPACE_STORAGE_BYTES:-5368709120}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  UPLOADS_DIR: /data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_PREFIX: ${S3_PREFIX:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kite
      POSTGRES_DB: kite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kite -d kite']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # Applies pending migrations, then exits; the API starts only after it succeeds.
  migrate:
    image: kite-api:${KITE_TAG:-latest}
    pull_policy: never
    command: ['node', 'dist/scripts/migrate.js']
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    image: kite-api:${KITE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    logging: *logging

  web:
    image: kite-web:${KITE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Daily pg_dump + uploads tarball into ./backups (see docker/backup/backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/usr/local/bin/backup.sh']
    environment:
      <<: *db-env
      TZ: ${TZ:-Asia/Ulaanbaatar}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

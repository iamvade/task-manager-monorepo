# Kite under a sub-path of an existing nginx site, e.g. https://staging.api.shoppyhub.mn/tasks.
# See docs/DEPLOY.md, "Behind an existing nginx". Assumes:
#   - .env: DOMAIN=staging.api.shoppyhub.mn, BASE_PATH=/tasks
#   - the api container published on 127.0.0.1:3000 (docker-compose.override.yml)
#   - the web build (BASE_PATH=/tasks) copied to /var/www/kite/tasks
#
# 1. Put this map in the http {} block (e.g. /etc/nginx/conf.d/kite-upgrade.conf), once:
#
#      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#
# 2. Paste the locations below into the existing server {} for the domain (the one that
#    already has the TLS certificate).

# The API (Swagger UI is not supported under a path). The trailing slashes strip /tasks, so the API
# sees /api/v1/…; this also carries the realtime WebSocket at /tasks/api/v1/ws.
location /tasks/api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (don't append to) X-Forwarded-For: the API trusts exactly one hop (TRUST_PROXY=1)
    # and uses it for the login throttle.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    client_max_body_size 30m;
}

location = /tasks {
    return 301 /tasks/;
}

# The single-page app: real files, else index.html for client routes. `root` (not `alias`)
# so try_files works: /tasks/x is read from /var/www/kite/tasks/x.
location /tasks/ {
    root /var/www/kite;
    try_files $uri /tasks/index.html;

    # Same headers as docker/caddy/Caddyfile. add_header in a location replaces the server's,
    # so every one is repeated in the nested location below.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Fonts come from Google Fonts; the editor (TipTap) injects a <style> element.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://$host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    # Hashed build assets never change.
    location /tasks/assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

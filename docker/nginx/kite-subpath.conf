# Kite under a sub-path of an existing nginx site, e.g. https://staging.api.shoppyhub.mn/task-manager.
# nginx terminates HTTPS and forwards /task-manager/ to the Kite web container (Caddy, plain HTTP
# on 127.0.0.1:8080), which serves the app and proxies its API. See docs/DEPLOY.md, "Behind an
# existing nginx". Assumes .env has DOMAIN=staging.api.shoppyhub.mn, BASE_PATH=/task-manager and
# the "behind your own proxy" settings (SITE_ADDRESS=:80, HTTP_BIND=127.0.0.1:8080, …).
#
# 1. Put this map in the http {} block once, e.g. as /etc/nginx/conf.d/kite-upgrade.conf (skip it
#    if `sudo nginx -T | grep connection_upgrade` already shows one):
#
#      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#
# 2. Paste the two locations below into the existing `server { listen 443 ssl; … }` for the
#    domain (the one with the certificate), then: sudo nginx -t && sudo systemctl reload nginx

# 3. Only with the remote Claude connector (COMPOSE_PROFILES=connector): also paste the three
#    /.well-known locations at the end of this file. OAuth clients look for a server's metadata
#    at the host root with the path appended, which is outside /task-manager/.

location = /task-manager {
    absolute_redirect off;
    return 301 /task-manager/;
}

# The trailing slashes strip /task-manager: Caddy sees /, /assets/…, /api/v1/… (incl. the realtime
# WebSocket at /task-manager/api/v1/ws). Security and cache headers come from Caddy.
location /task-manager/ {
    proxy_pass http://127.0.0.1:8080/;
    # Any proxy_set_header here replaces all of the server-level ones, so every header is set again.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (don't append to) X-Forwarded-For: Caddy trusts this hop and the API trusts two
    # (TRUST_PROXY=2), so a client can't spoof its address for the login throttle.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The realtime socket stays open for hours; uploads are up to 25 MB.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    client_max_body_size 30m;
}

# --- Remote Claude connector (optional, see step 3) ---------------------------------------------
# The connector address is https://<host>/task-manager/mcp and its authorization server is
# https://<host>/task-manager. Clients build the metadata URLs by inserting /.well-known/… before
# that path (RFC 9728 §3.1, RFC 8414 §3.1), so they land at the host root: send them to Kite.
# If the site already serves /.well-known/ for something else, these exact matches still win.

location = /.well-known/oauth-protected-resource/task-manager/mcp {
    proxy_pass http://127.0.0.1:8080/api/v1/oauth/resource-metadata;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-authorization-server/task-manager {
    proxy_pass http://127.0.0.1:8080/api/v1/oauth/metadata;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The OpenID Connect form of the same document, which some clients try next.
location = /.well-known/openid-configuration/task-manager {
    proxy_pass http://127.0.0.1:8080/api/v1/oauth/metadata;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

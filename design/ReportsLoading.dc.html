<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Тайлан — ачаалж байна</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#52525B;text-decoration:none}a:hover{color:#18181B}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.nav:hover{background:#EDEDF0}
.ghost:hover{background:#F4F4F5}
.ghost:focus-visible,.nav:focus-visible,.seg:focus-visible,input:focus-visible{outline:2px solid #6E56CF;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sk{background:linear-gradient(90deg,#F1F1F3 25%,#E7E7EB 37%,#F1F1F3 63%);background-size:400% 100%;animation:sk-shimmer 1.4s ease-in-out infinite}
@keyframes sk-shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion: reduce){.sk{animation:none;background:#F1F1F3}}
</style>
</helmet>

<div lang="{{lang}}" style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #18181B; background: #FFFFFF; -webkit-font-smoothing: antialiased">

  <!-- SIDEBAR -->
  <nav aria-label="{{L.workspace}}" style="flex: 1 1 248px; max-width: 248px; min-width: 220px; box-sizing: border-box; background: #F7F7F8; border-right: 1px solid #E6E6EA; display: flex; flex-direction: column; gap: 16px; padding: 12px 8px">
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px">
      <span style="width: 24px; height: 24px; border-radius: 6px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">K</span>
      <span style="flex: 1; font-weight: 600">Kite Studio</span>
    </div>
    <div style="padding: 0 4px">
      <label style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 1px solid #E6E6EA; border-radius: 8px; background: #FFFFFF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <span class="sr">{{L.search}}</span>
        <input type="search" placeholder="{{L.search}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; padding: 0">
      </label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a class="nav" href="MyTasks.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; color: #3F3F46">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>
        <span style="flex: 1; font-weight: 500">{{L.myTasks}}</span><span style="font-size: 12px; color: #6B6B74">7</span>
      </a>
      <a class="nav" href="EmptyInbox.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; color: #3F3F46">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
        <span style="flex: 1; font-weight: 500">{{L.inbox}}</span>
      </a>
      <a class="nav" href="#" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: {{accentSoft}}; color: {{accent}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M8 17v-5M13 17V8M18 17v-9"></path></svg>
        <span style="flex: 1; font-weight: 600">{{L.reports}}</span>
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="height: 28px; padding: 0 12px; display: flex; align-items: center; font-size: 12px; font-weight: 500; color: #6B6B74">{{L.spaces}}</span>
      <sc-for list="{{spaces}}" as="sp" hint-placeholder-count="3">
        <span style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; color: #3F3F46; font-weight: 500">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          <span style="width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; {{sp.badge}}">{{sp.initial}}</span>{{sp.name}}
        </span>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #E6E6EA; padding-top: 8px">
      <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
        <span id="lang-label" style="flex: 1; font-weight: 500; color: #3F3F46">{{L.language}}</span>
        <div role="radiogroup" aria-labelledby="lang-label" style="display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: #EDEDF0">
          <sc-for list="{{langs}}" as="lg" hint-placeholder-count="2">
            <button class="seg" role="radio" aria-checked="{{lg.active}}" onClick="{{lg.pick}}" lang="{{lg.code}}" title="{{lg.full}}" style="height: 24px; padding: 0 8px; border: 0; border-radius: 5px; font-size: 12px; font-weight: 600; {{lg.style}}">{{lg.short}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px">
        <span style="width: 24px; height: 24px; border-radius: 12px; background: #E0E7FF; color: #3730A3; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{me.initials}}</span>
        <span style="flex: 1; font-size: 13px; font-weight: 500">{{me.full}}</span>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-direction: column; border-bottom: 1px solid #E6E6EA">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding: 8px 24px; box-sizing: border-box">
        <h1 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M8 17v-5M13 17V8M18 17v-9"></path></svg>
          {{L.reports}}
        </h1>
        <span role="status" style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6B6B74">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
          {{L.loading}}
        </span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 0 24px">
        <div role="tablist" aria-label="{{L.reports}}" style="display: flex; gap: 4px">
          <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
            <a role="tab" href="#" aria-selected="{{tb.active}}" style="height: 40px; padding: 0 10px; display: flex; align-items: center; font-size: 13px; font-weight: 500; {{tb.style}}">{{tb.label}}</a>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 8px">
          <div style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: #F4F4F5">
            <sc-for list="{{periods}}" as="pd" hint-placeholder-count="4">
              <span style="height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; display: flex; align-items: center; white-space: nowrap; {{pd.style}}">{{pd.label}}</span>
            </sc-for>
          </div>
          <button disabled="disabled" style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 500; color: #A1A1AA; cursor: not-allowed">{{L.export}}</button>
        </div>
      </div>
    </header>

    <div aria-busy="true" aria-live="polite" style="display: flex; flex-direction: column; gap: 24px; padding: 20px 24px 40px">
      <span class="sr">{{L.loading}}</span>
      <span aria-hidden="true" class="sk" style="width: 420px; max-width: 70%; height: 12px; border-radius: 6px; margin-top: 4px"></span>

      <!-- Stat card skeletons -->
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #EFEFF2; border-radius: 12px">
            <span style="display: flex; align-items: center; gap: 8px">
              <span class="sk" style="width: 14px; height: 14px; border-radius: 7px"></span>
              <span style="font-size: 13px; color: #A1A1AA">{{c.label}}</span>
            </span>
            <span class="sk" style="width: 96px; height: 28px; border-radius: 6px"></span>
            <span class="sk" style="height: 12px; border-radius: 6px; {{c.w}}"></span>
          </div>
        </sc-for>
      </div>

      <!-- Chart placeholders -->
      <div aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 16px">
        <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid #EFEFF2; border-radius: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 15px; font-weight: 600; color: #A1A1AA">{{L.throughput}}</span>
            <span class="sk" style="width: 240px; height: 10px; border-radius: 5px"></span>
          </div>
          <div style="position: relative; height: 200px; margin-left: 32px">
            <span style="position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #F4F4F5"></span>
            <span style="position: absolute; left: 0; right: 0; top: 50px; height: 1px; background: #F4F4F5"></span>
            <span style="position: absolute; left: 0; right: 0; top: 100px; height: 1px; background: #F4F4F5"></span>
            <span style="position: absolute; left: 0; right: 0; top: 150px; height: 1px; background: #F4F4F5"></span>
            <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: #E6E6EA"></span>
            <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 12px; padding: 0 8px">
              <sc-for list="{{bars}}" as="b" hint-placeholder-count="12">
                <span class="sk" style="flex: 1; border-radius: 4px 4px 0 0; {{b.h}}"></span>
              </sc-for>
            </div>
          </div>
          <div style="display: flex; justify-content: space-between; margin-left: 32px">
            <span class="sk" style="width: 36px; height: 8px; border-radius: 4px"></span>
            <span class="sk" style="width: 36px; height: 8px; border-radius: 4px"></span>
            <span class="sk" style="width: 36px; height: 8px; border-radius: 4px"></span>
            <span class="sk" style="width: 36px; height: 8px; border-radius: 4px"></span>
          </div>
        </section>
        <section style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 20px; border: 1px solid #EFEFF2; border-radius: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 15px; font-weight: 600; color: #A1A1AA">{{L.waits}}</span>
            <span class="sk" style="width: 180px; height: 10px; border-radius: 5px"></span>
          </div>
          <sc-for list="{{waitRows}}" as="w" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between">
                <span class="sk" style="width: 90px; height: 10px; border-radius: 5px"></span>
                <span class="sk" style="width: 48px; height: 10px; border-radius: 5px"></span>
              </div>
              <span class="sk" style="height: 12px; border-radius: 4px; {{w.w}}"></span>
            </div>
          </sc-for>
          <span class="sk" style="margin-top: auto; height: 44px; border-radius: 8px"></span>
        </section>
      </div>

      <!-- Table skeleton -->
      <section aria-hidden="true" style="display: flex; flex-direction: column; border: 1px solid #EFEFF2; border-radius: 12px; overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 20px">
          <span style="font-size: 15px; font-weight: 600; color: #A1A1AA">{{L.aging}}</span>
          <span class="sk" style="width: 300px; max-width: 60%; height: 10px; border-radius: 5px"></span>
        </div>
        <div style="height: 36px; border-top: 1px solid #F4F4F5; border-bottom: 1px solid #F4F4F5; background: #FAFAFB"></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 176px 160px 148px 120px; align-items: center; gap: 16px; height: 48px; padding: 0 20px; border-bottom: 1px solid #F4F4F5">
            <span class="sk" style="height: 10px; border-radius: 5px; {{r.w}}"></span>
            <span class="sk" style="width: 110px; height: 10px; border-radius: 5px"></span>
            <span style="display: flex; align-items: center; gap: 8px"><span class="sk" style="width: 24px; height: 24px; border-radius: 12px"></span><span class="sk" style="width: 72px; height: 10px; border-radius: 5px"></span></span>
            <span class="sk" style="width: 88px; height: 10px; border-radius: 5px"></span>
            <span class="sk" style="justify-self: end; width: 56px; height: 10px; border-radius: 5px"></span>
          </div>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","default":"mn","options":["mn","en"]},"accent":{"editor":"color","default":"#6E56CF","options":["#6E56CF","#2F6FEB","#0F766E","#3F3F46"]},"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: undefined };
  }

  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.language || 'mn';
    const mn = lang === 'mn';
    const pick = (pair) => (mn ? pair[0] : pair[1]);
    const accent = this.props.accent ?? '#6E56CF';
    const STR = {
      mn: {
        workspace: 'Ажлын орчин', search: 'Хайх', myTasks: 'Миний ажлууд', inbox: 'Мэдэгдэл', reports: 'Тайлан', spaces: 'Орон зай',
        language: 'Хэл', export: 'CSV татах', loading: 'Тайланг ачаалж байна…',
        throughput: 'Гүйцэтгэлийн хурд', waits: 'Ажил хаана хүлээгддэг вэ', aging: 'Удаж буй ажлууд',
        c1: 'Дууссан ажил', c2: 'Гүйцэтгэх хугацааны медиан', c3: 'Хугацаандаа дууссан', c4: 'Хугацаа хэтэрсэн'
      },
      en: {
        workspace: 'Workspace', search: 'Search', myTasks: 'My Tasks', inbox: 'Inbox', reports: 'Reports', spaces: 'Spaces',
        language: 'Language', export: 'Export CSV', loading: 'Loading reports…',
        throughput: 'Throughput', waits: 'Where work waits', aging: 'Aging tasks',
        c1: 'Completed', c2: 'Median cycle time', c3: 'On-time delivery', c4: 'Overdue'
      }
    };
    const L = STR[lang] || STR.mn;
    const langs = [{ code: 'mn', short: 'МН', full: 'Монгол' }, { code: 'en', short: 'EN', full: 'English' }].map((d) => ({
      ...d, active: d.code === lang, pick: () => this.setState({ lang: d.code }),
      style: d.code === lang ? 'background:#FFFFFF;color:#18181B;box-shadow:0 1px 2px rgba(24,24,27,0.08)' : 'background:transparent;color:#6B6B74'
    }));
    const tabs = [['Тойм', 'Overview'], ['Спринт', 'Sprints'], ['Ачаалал', 'Workload'], ['Хүмүүс', 'People']].map((lb, i) => ({
      label: pick(lb), active: i === 0, style: i === 0 ? 'color:#18181B;box-shadow:inset 0 -2px 0 ' + accent : 'color:#6B6B74'
    }));
    const periods = [['Энэ долоо хоног', 'This week'], ['Сүүлийн 4 долоо хоног', 'Last 4 weeks'], ['Энэ улирал', 'This quarter'], ['Өөрөө сонгох', 'Custom']].map((lb, i) => ({
      label: pick(lb), style: i === 1 ? 'background:#FFFFFF;color:#18181B;box-shadow:0 1px 2px rgba(24,24,27,0.08)' : 'color:#A1A1AA'
    }));
    const spaces = [
      { name: ['Бүтээгдэхүүн', 'Product'], initial: ['Б', 'P'], badge: 'background:#EDE9FE;color:#5B21B6' },
      { name: ['Инженерчлэл', 'Engineering'], initial: ['И', 'E'], badge: 'background:#DCFCE7;color:#166534' },
      { name: ['Дизайн', 'Design'], initial: ['Д', 'D'], badge: 'background:#FFE4E6;color:#9F1239' }
    ].map((x) => ({ name: pick(x.name), initial: pick(x.initial), badge: x.badge }));
    return {
      lang, L, langs, tabs, periods, spaces, accent, accentSoft: accent + '1A',
      me: { initials: mn ? 'АБ' : 'AB', full: mn ? 'Ану Болд' : 'Anu Bold' },
      cards: [[L.c1, 140], [L.c2, 120], [L.c3, 100], [L.c4, 150]].map(([label, w]) => ({ label, w: 'width:' + w + 'px' })),
      bars: [40, 55, 48, 62, 58, 70, 60, 66, 74, 70, 78, 64].map((h) => ({ h: 'height:' + h + '%' })),
      waitRows: [30, 45, 90].map((w) => ({ w: 'width:' + w + '%' })),
      rows: [62, 48, 70, 40, 56].map((w) => ({ w: 'width:' + w + '%' }))
    };
  }
}
</script>
</body>
</html>

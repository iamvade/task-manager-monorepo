<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Стэндап — гар утас</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#52525B;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #6E56CF;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>

<div lang="{{lang}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 15px; line-height: 22px; color: #18181B; background: #FFFFFF; -webkit-font-smoothing: antialiased; overflow: hidden">

  <!-- Top bar -->
  <div style="flex: none; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px; border-bottom: 1px solid #EFEFF2">
    <a href="Standup.dc.html" aria-label="{{L.close}}" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 16px; font-weight: 600">{{L.title}}</span>
      <span style="font-size: 12px; line-height: 16px; color: #6B6B74">{{L.sub}}</span>
    </div>
    <button onClick="{{cycleLang}}" aria-label="{{L.language}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; font-size: 12px; font-weight: 700; color: #3F3F46">{{langShort}}</button>
  </div>

  <!-- Scrolling body -->
  <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 16px 16px 24px">

    <section aria-labelledby="m-y" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="m-y" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #3F3F46">
        <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #A1A1AA"></span>{{L.yesterday}}
        <span style="font-size: 12px; font-weight: 400; color: #6B6B74">{{L.suggested}}</span>
      </h2>
      <div style="display: flex; flex-direction: column; border: 1px solid #EFEFF2; border-radius: 12px; overflow: hidden">
        <sc-for list="{{suggestions}}" as="sg" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 4px 4px 12px; border-bottom: 1px solid #F4F4F5">
            <span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; {{sg.iconBg}}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{sg.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 12px; line-height: 16px; color: #6B6B74">{{sg.kind}}</span>
              <span style="font-size: 14px; line-height: 20px; font-weight: 500">{{sg.task}}</span>
            </span>
            <button onClick="{{sg.remove}}" aria-label="{{sg.removeLabel}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
          </div>
        </sc-for>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span class="sr">{{L.addYesterday}}</span>
          <input type="text" placeholder="{{L.addYesterday}}" style="flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; padding: 0">
        </label>
      </div>
    </section>

    <section aria-labelledby="m-t" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="m-t" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: {{accent}}">
        <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>{{L.today}}
        <span style="font-size: 12px; font-weight: 400; color: #6B6B74">{{L.tapToAdd}}</span>
      </h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{todayChips}}" as="c" hint-placeholder-count="4">
          <button aria-pressed="{{c.on}}" onClick="{{c.toggle}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px 6px 10px; border-radius: 20px; font-size: 14px; font-weight: 500; text-align: left; {{c.style}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{c.icon}}"></path></svg>
            <span>{{c.name}}</span>
          </button>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; min-height: 48px; padding: 0 12px; border: 1px solid #E6E6EA; border-radius: 12px">
        <span class="sr">{{L.addToday}}</span>
        <input type="text" placeholder="{{L.addToday}}" style="flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; padding: 0">
      </label>
    </section>

    <section aria-labelledby="m-b" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="m-b" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #B42318">
        <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #DC2626"></span>{{L.blockers}}
        <span style="font-size: 12px; font-weight: 400; color: #6B6B74">{{L.optional}}</span>
      </h2>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 8px 12px; border: 1px solid #E6E6EA; border-radius: 12px">
        <label style="display: flex; align-items: center; min-height: 44px">
          <span class="sr">{{L.blockers}}</span>
          <input type="text" placeholder="{{L.blockerPh}}" style="flex: 1; border: 0; outline: none; background: transparent; font-size: 15px; padding: 0">
        </label>
        <div style="display: flex; gap: 8px">
          <button onClick="{{toggleLink}}" aria-pressed="{{linked}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid #E6E6EA; border-radius: 10px; font-size: 13px; font-weight: 500; {{linkStyle}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>{{linkLabel}}
          </button>
          <button onClick="{{toggleMention}}" aria-pressed="{{mentioned}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid #E6E6EA; border-radius: 10px; font-size: 13px; font-weight: 500; {{mentionStyle}}">
            <span aria-hidden="true">@</span>{{mentionLabel}}
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Sticky footer -->
  <div style="flex: none; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 20px; border-top: 1px solid #EFEFF2; background: #FFFFFF">
    <a href="Standup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600">{{L.post}}</a>
    <span style="text-align: center; font-size: 12px; color: #6B6B74">{{L.visibleTo}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","default":"mn","options":["mn","en"]},"accent":{"editor":"color","default":"#6E56CF","options":["#6E56CF","#2F6FEB","#0F766E","#3F3F46"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: undefined, removed: {}, today: { t1: true }, linked: false, mentioned: false };
  }

  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.language || 'mn';
    const mn = lang === 'mn';
    const pick = (pair) => (mn ? pair[0] : pair[1]);
    const accent = this.props.accent ?? '#6E56CF';
    const accentSoft = accent + '1A';
    const L = mn ? {
      close: 'Хаах', title: 'Таны стэндап', sub: 'Мобайл баг · Баасан, 10/9', language: 'Хэл: Монгол',
      yesterday: 'Өчигдөр', suggested: 'санал болгосон', addYesterday: 'Өөр зүйл нэмэх…',
      today: 'Өнөөдөр', tapToAdd: 'дарж нэмнэ', addToday: 'Өөр юу хийх вэ?',
      blockers: 'Саад', optional: 'заавал биш', blockerPh: 'Юу саатуулж байна?',
      post: 'Нийтлэх', visibleTo: 'Мобайл багийн 6 гишүүнд харагдана'
    } : {
      close: 'Close', title: 'Your standup', sub: 'Mobile team · Fri, Oct 9', language: 'Language: English',
      yesterday: 'Yesterday', suggested: 'suggested', addYesterday: 'Add something else…',
      today: 'Today', tapToAdd: 'tap to add', addToday: 'Anything else?',
      blockers: 'Blockers', optional: 'optional', blockerPh: 'What’s slowing you down?',
      post: 'Post update', visibleTo: 'Visible to the 6 people in Mobile team'
    };
    const KIND = {
      done: [['Дуусгасан', 'Completed'], 'M5 12.5 9.5 17 19 7.5', 'background:#E8F5EC;color:#166534'],
      review: [['Хяналтад шилжүүлсэн', 'Moved to review'], 'M5 12h14M13 6l6 6-6 6', 'background:' + accentSoft + ';color:' + accent],
      comment: [['Сэтгэгдэл бичсэн', 'Commented on'], 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', 'background:#F1F1F3;color:#52525B']
    };
    const removed = s.removed || {};
    const suggestions = [
      ['s1', 'done', ['Хуулийн хэлтэст промо кодын нөхцөлөөр хариулах', 'Reply to legal on promo-code terms']],
      ['s2', 'review', ['Хадгалсан сагсны PRD бичих', 'Write PRD: saved carts']],
      ['s3', 'comment', ['Төлбөрийн хуудас — респонсив байрлал', 'Checkout page — responsive layout']]
    ].filter((d) => !removed[d[0]]).map(([id, k, t]) => ({
      kind: pick(KIND[k][0]), icon: KIND[k][1], iconBg: KIND[k][2], task: pick(t),
      removeLabel: (mn ? 'Хасах: ' : 'Remove: ') + pick(t),
      remove: () => this.setState({ removed: { ...(this.state.removed || {}), [id]: true } })
    }));
    const tsel = s.today || {};
    const todayChips = [
      ['t1', ['Хадгалсан сагсны PRD-г дуусгах', 'Finish PRD: saved carts']],
      ['t2', ['Q4-ийн тэргүүлэх чиглэлийг батлах', 'Approve Q4 priorities']],
      ['t3', ['Танилцуулах урсгалыг шинэчлэх', 'Redesign onboarding flow']],
      ['t4', ['Спринтийн тоймын тэмдэглэл', 'Sprint review notes']]
    ].map(([id, n]) => {
      const on = !!tsel[id];
      return {
        name: pick(n), on, icon: on ? 'M5 12.5 9.5 17 19 7.5' : 'M12 5v14M5 12h14',
        toggle: () => this.setState({ today: { ...(this.state.today || {}), [id]: !on } }),
        style: on ? 'border:1px solid ' + accent + ';background:' + accentSoft + ';color:#18181B' : 'border:1px solid #E6E6EA;background:#FFFFFF;color:#3F3F46'
      };
    });
    const linked = !!s.linked, mentioned = !!s.mentioned;
    const onStyle = 'border-color:' + accent + ';background:' + accentSoft + ';color:' + accent;
    return {
      lang, L, accent, suggestions, todayChips, linked, mentioned,
      langShort: mn ? 'МН' : 'EN',
      cycleLang: () => this.setState({ lang: lang === 'mn' ? 'en' : 'mn' }),
      toggleLink: () => this.setState({ linked: !this.state.linked }),
      toggleMention: () => this.setState({ mentioned: !this.state.mentioned }),
      linkLabel: linked ? (mn ? 'PRD: хадгалсан сагс' : 'PRD: saved carts') : (mn ? 'Ажил холбох' : 'Link a task'),
      mentionLabel: mentioned ? '@' + (mn ? 'Бат О.' : 'Bat O.') : (mn ? 'Хэн туслах' : 'Who can help'),
      linkStyle: linked ? onStyle : 'background:#FFFFFF;color:#3F3F46',
      mentionStyle: mentioned ? onStyle : 'background:#FFFFFF;color:#3F3F46'
    };
  }
}
</script>
</body>
</html>

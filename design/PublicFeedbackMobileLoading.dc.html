<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Санал хүсэлт — гар утас, илгээж байна</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>body{margin:0;background:#FAFAFB}</style>
</helmet>
<div style="width: 390px;  background: #FAFAFB; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B">
  <dc-import name="PublicFeedback" scene="loading" language="{{language}}" accent="{{accent}}" hint-size="390px,1960px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","default":"mn","options":["mn","en"]},"accent":{"editor":"color","default":"#6E56CF","options":["#6E56CF","#2F6FEB","#0F766E","#3F3F46"]},"$preview":{"width":390,"height":1960}}'>
class Component extends DCLogic {
  renderVals() {
    return { language: this.props.language || 'mn', accent: this.props.accent ?? '#6E56CF' };
  }
}
</script>
</body>
</html>

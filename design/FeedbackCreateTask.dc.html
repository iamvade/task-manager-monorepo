<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Санал хүсэлтээс ажил үүсгэх</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#52525B;text-decoration:none}a:hover{color:#18181B}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.ghost:hover{background:#F4F4F5}
.chipf:hover{background:#F4F4F5}
.ghost:focus-visible,.seg:focus-visible,.chipf:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #6E56CF;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>

<div lang="{{lang}}" style="position: relative; display: flex; min-height: 100vh; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #18181B; background: #FFFFFF; -webkit-font-smoothing: antialiased; overflow: hidden">

  <!-- Background: inbox + feedback panel, inactive -->
  <div aria-hidden="true" style="flex: 0 0 248px; background: #F7F7F8; border-right: 1px solid #E6E6EA"></div>
  <div aria-hidden="true" style="flex: 1; display: flex; flex-direction: column">
    <div style="height: 64px; border-bottom: 1px solid #E6E6EA"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; width: 66%; min-width: 880px; background: #FFFFFF; border-left: 1px solid #E6E6EA; display: flex; flex-direction: column">
    <div style="height: 56px; border-bottom: 1px solid #E6E6EA"></div>
    <div style="display: flex; flex: 1">
      <div style="flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px">
        <span style="width: 70px; height: 22px; border-radius: 6px; background: #FDECEC"></span>
        <span style="width: 60%; height: 16px; border-radius: 8px; background: #E4E4E7"></span>
        <span style="width: 90%; height: 10px; border-radius: 5px; background: #F1F1F3"></span>
        <span style="width: 80%; height: 10px; border-radius: 5px; background: #F1F1F3"></span>
      </div>
      <div style="width: 320px; background: #FAFAFB; border-left: 1px solid #EFEFF2"></div>
    </div>
  </div>
  <a href="FeedbackDetail.dc.html" aria-label="{{L.cancel}}" style="position: absolute; inset: 0; background: rgba(24, 24, 27, 0.36)"></a>

  <!-- ===== MODAL ===== -->
  <form role="dialog" aria-modal="true" aria-labelledby="ct-h" style="position: absolute; top: 48px; left: 50%; transform: translateX(-50%); width: 680px; max-width: calc(100% - 32px); box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 14px; box-shadow: 0 24px 64px rgba(24, 24, 27, 0.22); display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 20px; border-bottom: 1px solid #F1F1F3">
      <h2 id="ct-h" style="flex: 1; margin: 0; font-size: 15px; font-weight: 600">{{L.title}}</h2>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: #FDECEC; color: #B42318; font-size: 12px; font-weight: 600">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path></svg>{{L.from}}
      </span>
      <div role="radiogroup" aria-label="{{L.language}}" style="display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: #F4F4F5">
        <sc-for list="{{langs}}" as="lg" hint-placeholder-count="2">
          <button type="button" class="seg" role="radio" aria-checked="{{lg.active}}" onClick="{{lg.pick}}" lang="{{lg.code}}" title="{{lg.full}}" style="height: 24px; padding: 0 8px; border: 0; border-radius: 5px; font-size: 12px; font-weight: 600; {{lg.style}}">{{lg.short}}</button>
        </sc-for>
      </div>
      <a href="FeedbackDetail.dc.html" class="ghost" aria-label="{{L.cancel}}" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 8px; border-radius: 6px">
        <kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid #E6E6EA; border-radius: 4px; color: #6B6B74">Esc</kbd>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="t-title" style="font-size: 12px; font-weight: 500; color: #6B6B74">{{L.taskTitle}}</label>
        <textarea id="t-title" rows="1" style="resize: none; padding: 8px 10px; border: 1px solid #E6E6EA; border-radius: 8px; outline: none; font-size: 17px; line-height: 24px; font-weight: 600">{{L.prefTitle}}</textarea>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="t-desc" style="font-size: 12px; font-weight: 500; color: #6B6B74">{{L.desc}}</label>
        <textarea id="t-desc" rows="6" style="resize: vertical; padding: 10px 12px; border: 1px solid #E6E6EA; border-radius: 8px; outline: none; font-size: 14px; line-height: 21px; color: #27272A">{{L.prefBody}}</textarea>
      </div>

      <!-- Fields -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 500; color: #6B6B74">{{f.label}}</span>
            <button type="button" class="chipf" aria-haspopup="listbox" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border: 1px solid #E6E6EA; border-radius: 8px; background: #FFFFFF; text-align: left; font-size: 14px">
              <sc-if value="{{f.hasAvatar}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; {{f.avatar}}">{{f.initials}}</span></sc-if>
              <sc-if value="{{f.hasDot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; {{f.dot}}"></span></sc-if>
              <sc-if value="{{f.hasIcon}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{f.iconStyle}}"><path d="{{f.icon}}"></path></svg></sc-if>
              <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.value}}</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
          </div>
        </sc-for>
      </div>

      <!-- Attachments carry over -->
      <fieldset style="margin: 0; padding: 12px; border: 1px solid #EFEFF2; border-radius: 10px; background: #FAFAFB; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0 4px; font-size: 12px; font-weight: 500; color: #52525B">{{attachLegend}}</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{attachments}}" as="a" hint-placeholder-count="4">
            <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 8px; border: 1px solid #E6E6EA; border-radius: 8px; background: #FFFFFF; font-size: 12px; cursor: pointer; {{a.style}}">
              <input type="checkbox" checked="{{a.on}}" onChange="{{a.toggle}}" style="width: 15px; height: 15px; margin: 0; accent-color: {{accent}}">
              <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 5px; font-size: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; {{a.iconStyle}}">{{a.ext}}</span>
              <span style="display: flex; flex-direction: column; line-height: 14px">
                <span style="font-weight: 500">{{a.name}}</span>
                <span style="color: #6B6B74">{{a.size}}</span>
              </span>
            </label>
          </sc-for>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer">
          <input type="checkbox" checked="{{setLinked}}" onChange="{{toggleSetLinked}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{accent}}">{{L.setLinked}}
        </label>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer">
          <input type="checkbox" checked="{{notify}}" onChange="{{toggleNotify}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{accent}}">{{L.notify}}
        </label>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 12px 20px; border-top: 1px solid #EFEFF2; border-radius: 0 0 14px 14px; background: #FAFAFB">
      <span style="flex: 1; font-size: 12px; color: #6B6B74">{{L.footHint}}</span>
      <a href="FeedbackDetail.dc.html" class="ghost" style="display: flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #3F3F46">{{L.cancel}}</a>
      <a href="FeedbackDetail.dc.html" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 14px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 500">
        {{L.create}}<kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.2)">⌘ ↵</kbd>
      </a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","default":"mn","options":["mn","en"]},"accent":{"editor":"color","default":"#6E56CF","options":["#6E56CF","#2F6FEB","#0F766E","#3F3F46"]},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: undefined, att: { a1: true, a2: true, a3: true, a4: true }, setLinked: true, notify: false };
  }

  renderVals() {
    const s = this.state || {};
    const lang = s.lang || this.props.language || 'mn';
    const mn = lang === 'mn';
    const accent = this.props.accent ?? '#6E56CF';
    const L = mn ? {
      language: 'Хэл', title: 'Санал хүсэлтээс ажил үүсгэх', from: 'FB-1042-оос', cancel: 'Болих', create: 'Ажил үүсгэх',
      taskTitle: 'Ажлын нэр', desc: 'Тайлбар',
      prefTitle: 'Төлбөр төлөх алхам дээр апп гацаж байна',
      prefBody: 'Сагсандаа 3 бараа нэмээд төлбөр төлөх гэтэл апп гацчихлаа.\n1. Сагс → “Захиалах” дарах\n2. Хадгалсан Visa картаа сонгох\n3. “Төлөх” дарах — дэлгэц хөдлөхгүй, 30 секундын дараа апп хаагдана\n\nТөхөөрөмж: iPhone 13 · iOS 17.4 · Апп 4.1.2\n— Санал хүсэлтээс: Энхжин Д. · FB-1042',
      setLinked: 'Санал хүсэлтийн төлөвийг “Ажилтай холбосон” болгох', notify: 'Ажил дуусахад илгээгчид имэйлээр мэдэгдэх',
      footHint: 'Илгээгчийн холбоо барих мэдээлэл ажилд хуулагдахгүй.'
    } : {
      language: 'Language', title: 'Create task from feedback', from: 'From FB-1042', cancel: 'Cancel', create: 'Create task',
      taskTitle: 'Task title', desc: 'Description',
      prefTitle: 'App freezes on the payment step',
      prefBody: 'I added 3 items to my cart and the app froze when I tried to pay.\n1. Cart → tap “Checkout”\n2. Choose my saved Visa card\n3. Tap “Pay” — the screen stops responding and the app closes after ~30 seconds\n\nDevice: iPhone 13 · iOS 17.4 · App 4.1.2\n— From feedback: Enkhjin D. · FB-1042',
      setLinked: 'Set the feedback status to “Linked to task”', notify: 'Email the submitter when the task is done',
      footHint: 'The submitter’s contact details are not copied to the task.'
    };
    const langs = [{ code: 'mn', short: 'МН', full: 'Монгол' }, { code: 'en', short: 'EN', full: 'English' }].map((d) => ({
      ...d, active: d.code === lang, pick: () => this.setState({ lang: d.code }),
      style: d.code === lang ? 'background:#FFFFFF;color:#18181B;box-shadow:0 1px 2px rgba(24,24,27,0.08)' : 'background:transparent;color:#6B6B74'
    }));
    const base = { hasAvatar: false, hasDot: false, hasIcon: false, avatar: '', initials: '', dot: '', icon: '', iconStyle: '' };
    const fields = [
      { ...base, label: mn ? 'Төсөл / жагсаалт' : 'Project / list', value: mn ? 'Апп шинэчлэл / Хийх' : 'App Redesign / To Do', hasDot: true, dot: 'background:#7C5CE0' },
      { ...base, label: mn ? 'Хариуцагч' : 'Assignee', value: mn ? 'Дорж Э.' : 'Dorj E.', hasAvatar: true, avatar: 'background:#FEF3C7;color:#92400E', initials: mn ? 'ДЭ' : 'DE' },
      { ...base, label: mn ? 'Ач холбогдол' : 'Priority', value: mn ? 'Өндөр' : 'High', hasIcon: true, icon: 'M4 22V4M4 4h12l-2 4 2 4H4', iconStyle: 'fill:#EA580C;stroke:#EA580C' },
      { ...base, label: mn ? 'Дуусах огноо' : 'Due date', value: mn ? 'Лхагва, 10-р сарын 21' : 'Wed, Oct 21', hasIcon: true, icon: 'M3 4h18v18H3zM16 2v4M8 2v4M3 10h18', iconStyle: 'fill:none;stroke:#52525B' }
    ];
    const att = s.att || {};
    const defs = [
      ['a1', 'IMG_2041.png', '1.2 MB', 'PNG', 'background:#E8F1FD;color:#1D4ED8'],
      ['a2', 'IMG_2042.png', '980 KB', 'PNG', 'background:#E8F1FD;color:#1D4ED8'],
      ['a3', 'screen-recording.mov', '4.2 MB', 'MOV', 'background:#F3E8FF;color:#6B21A8'],
      ['a4', 'device-log.txt', '12 KB', 'TXT', 'background:#F1F1F3;color:#3F3F46']
    ];
    const attachments = defs.map(([id, name, size, ext, iconStyle]) => {
      const on = att[id] !== false;
      return { name, size, ext, iconStyle, on, toggle: () => this.setState({ att: { ...(this.state.att || {}), [id]: !on } }), style: on ? '' : 'opacity:0.55' };
    });
    const n = attachments.filter((a) => a.on).length;
    return {
      lang, L, langs, accent, fields, attachments,
      attachLegend: mn ? 'Хавсралт ажилд хуулагдана · ' + n + '/' + defs.length : 'Attachments carried over to the task · ' + n + ' of ' + defs.length,
      setLinked: s.setLinked !== false, notify: !!s.notify,
      toggleSetLinked: () => this.setState({ setLinked: !(this.state.setLinked !== false) }),
      toggleNotify: () => this.setState({ notify: !this.state.notify })
    };
  }
}
</script>
</body>
</html>

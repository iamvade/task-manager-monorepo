<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create task — quick modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#52525B;text-decoration:none}a:hover{color:#18181B}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.ghost:hover{background:#F4F4F5}
.chip:hover{background:#F4F4F5}
.opt:hover{background:#F4F4F5}
.ghost:focus-visible,.chip:focus-visible,.opt:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #6E56CF;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>

<div style="position: relative; display: flex; flex-wrap: wrap; min-height: 100vh; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #18181B; background: #FFFFFF; -webkit-font-smoothing: antialiased; overflow: hidden">

  <!-- BACKGROUND: List view, inactive -->
  <div aria-hidden="true" style="flex: 1 1 248px; max-width: 248px; min-width: 220px; box-sizing: border-box; background: #F7F7F8; border-right: 1px solid #E6E6EA; display: flex; flex-direction: column; gap: 16px; padding: 12px 8px">
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px">
      <span style="width: 24px; height: 24px; border-radius: 6px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">K</span>
      <span style="font-weight: 600">Kite Studio</span>
    </div>
    <div style="margin: 0 4px; height: 32px; border: 1px solid #E6E6EA; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: #6B6B74">Search</div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px; color: #3F3F46; font-weight: 500">
      <span style="height: 32px; display: flex; align-items: center">My Tasks</span>
      <span style="height: 32px; display: flex; align-items: center">Inbox</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="height: 28px; padding: 0 12px; font-size: 12px; font-weight: 500; color: #6B6B74; display: flex; align-items: center">Spaces</span>
      <span style="height: 32px; padding: 0 12px; display: flex; align-items: center; font-weight: 500; color: #3F3F46">Product</span>
      <span style="height: 30px; padding: 0 12px 0 34px; border-radius: 8px; display: flex; align-items: center; font-size: 13px; font-weight: 500; background: {{accentSoft}}; color: {{accent}}">App Redesign</span>
      <span style="height: 30px; padding: 0 12px 0 34px; display: flex; align-items: center; font-size: 13px; color: #3F3F46">Checkout v2</span>
      <span style="height: 30px; padding: 0 12px 0 34px; display: flex; align-items: center; font-size: 13px; color: #3F3F46">Q4 Roadmap</span>
      <span style="height: 32px; padding: 0 12px; display: flex; align-items: center; font-weight: 500; color: #3F3F46">Engineering</span>
      <span style="height: 32px; padding: 0 12px; display: flex; align-items: center; font-weight: 500; color: #3F3F46">Design</span>
    </div>
  </div>
  <div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; height: 56px; padding: 0 24px; gap: 6px"><span style="color: #52525B">Product</span><span style="color: #A1A1AA">/</span><span style="font-weight: 600">App Redesign</span></div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #E6E6EA">
      <div style="display: flex; gap: 4px; font-size: 13px; font-weight: 500">
        <span style="height: 40px; padding: 0 10px; display: flex; align-items: center; box-shadow: inset 0 -2px 0 {{accent}}">List</span>
        <span style="height: 40px; padding: 0 10px; display: flex; align-items: center; color: #6B6B74">Board</span>
        <span style="height: 40px; padding: 0 10px; display: flex; align-items: center; color: #6B6B74">Calendar</span>
      </div>
      <span style="margin-bottom: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 500; display: flex; align-items: center">+ New Task</span>
    </div>
    <div style="padding: 8px 24px">
      <sc-for list="{{bgRows}}" as="r" hint-placeholder-count="10">
        <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 152px 112px; align-items: center; height: 44px; padding: 0 8px; border-bottom: 1px solid #EFEFF2; {{r.style}}">
          <span style="{{r.markStyle}}"></span>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
          <span style="font-size: 13px; color: #3F3F46">{{r.who}}</span>
          <span style="font-size: 13px; color: #52525B">{{r.due}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Scrim -->
  <a href="Main.dc.html" aria-label="Close and return to list" style="position: absolute; inset: 0; background: rgba(24, 24, 27, 0.32)"></a>

  <!-- ===== MODAL ===== -->
  <form role="dialog" aria-modal="true" aria-labelledby="ct-h" style="position: absolute; top: 112px; left: 50%; transform: translateX(-50%); width: 600px; max-width: calc(100% - 32px); box-sizing: border-box; margin: 0; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 14px; box-shadow: 0 24px 64px rgba(24, 24, 27, 0.20), 0 2px 6px rgba(24, 24, 27, 0.06); display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 20px">
      <span style="display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: #F4F4F5; font-size: 12px; font-weight: 500; color: #3F3F46">
        <span style="width: 8px; height: 8px; border-radius: 4px; {{project.dotStyle}}"></span>{{project.name}}
      </span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      <h2 id="ct-h" style="margin: 0; font-size: 13px; font-weight: 500; color: #52525B">New task</h2>
      <span style="flex: 1"></span>
      <a href="Main.dc.html" class="ghost" aria-label="Close (Esc)" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 8px; border-radius: 6px">
        <kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid #E6E6EA; border-radius: 4px; color: #6B6B74">Esc</kbd>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 20px 0">
      <label for="ct-title" class="sr">Task title</label>
      <textarea id="ct-title" rows="1" placeholder="Task title" style="border: 0; outline: none; resize: none; padding: 4px 0; background: transparent; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Skeleton loaders for the product grid</textarea>
      <label for="ct-desc" class="sr">Description</label>
      <textarea id="ct-desc" rows="2" placeholder="Add a description… Markdown and @mentions work here" style="border: 0; outline: none; resize: none; padding: 4px 0; background: transparent; font-size: 14px; line-height: 22px; color: #52525B"></textarea>
    </div>

    <!-- Field chips -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 20px 16px">

      <div style="position: relative">
        <button type="button" class="chip" onClick="{{openAssignee}}" aria-haspopup="listbox" aria-expanded="{{isAssignee}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 4px; border: 1px solid #E6E6EA; border-radius: 8px; font-size: 13px; font-weight: 500; {{assigneeChipStyle}}">
          <span style="width: 22px; height: 22px; border-radius: 11px; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; {{assignee.style}}">{{assignee.initials}}</span>
          {{assignee.name}}
          <kbd style="font-family: inherit; font-size: 10px; line-height: 14px; padding: 0 4px; border: 1px solid #E6E6EA; border-radius: 3px; color: #6B6B74">A</kbd>
        </button>
        <sc-if value="{{isAssignee}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; top: 36px; left: 0; z-index: 3; width: 264px; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 10px; box-shadow: 0 12px 32px rgba(24, 24, 27, 0.14); display: flex; flex-direction: column; overflow: hidden">
            <label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-bottom: 1px solid #EFEFF2">
              <span class="sr">Search people</span>
              <input type="text" placeholder="Assign to…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; padding: 0">
            </label>
            <div role="listbox" aria-label="Assignee" style="display: flex; flex-direction: column; padding: 4px">
              <sc-for list="{{assigneeOptions}}" as="o" hint-placeholder-count="6">
                <button type="button" role="option" aria-selected="{{o.selected}}" class="opt" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; text-align: left; font-size: 13px; {{o.rowStyle}}">
                  <span style="width: 20px; height: 20px; border-radius: 10px; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; {{o.style}}">{{o.initials}}</span>
                  <span style="flex: 1">{{o.name}}</span>
                  <span style="font-size: 12px; color: #6B6B74">{{o.meta}}</span>
                  <sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
                </button>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-top: 1px solid #EFEFF2; background: #FAFAFB; font-size: 11px; color: #6B6B74">
              <span><kbd style="font-family: inherit">↑↓</kbd> navigate</span><span><kbd style="font-family: inherit">↵</kbd> select</span><span><kbd style="font-family: inherit">⌫</kbd> unassign</span>
            </div>
          </div>
        </sc-if>
      </div>

      <div style="position: relative">
        <button type="button" class="chip" onClick="{{openDue}}" aria-haspopup="listbox" aria-expanded="{{isDue}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid #E6E6EA; border-radius: 8px; font-size: 13px; font-weight: 500; {{dueChipStyle}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
          {{due.chip}}
          <kbd style="font-family: inherit; font-size: 10px; line-height: 14px; padding: 0 4px; border: 1px solid #E6E6EA; border-radius: 3px; color: #6B6B74">D</kbd>
        </button>
        <sc-if value="{{isDue}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 36px; left: 0; z-index: 3; width: 264px; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 10px; box-shadow: 0 12px 32px rgba(24, 24, 27, 0.14); display: flex; flex-direction: column; overflow: hidden">
            <label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-bottom: 1px solid #EFEFF2">
              <span class="sr">Type a date</span>
              <input type="text" placeholder="Type a date, e.g. “next fri”" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; padding: 0">
            </label>
            <div role="listbox" aria-label="Due date" style="display: flex; flex-direction: column; padding: 4px">
              <sc-for list="{{dueOptions}}" as="o" hint-placeholder-count="6">
                <button type="button" role="option" aria-selected="{{o.selected}}" class="opt" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; text-align: left; font-size: 13px; {{o.rowStyle}}">
                  <span style="flex: 1">{{o.label}}</span>
                  <span style="font-size: 12px; color: #6B6B74">{{o.meta}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>

      <div style="position: relative">
        <button type="button" class="chip" onClick="{{openProject}}" aria-haspopup="listbox" aria-expanded="{{isProject}}" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid #E6E6EA; border-radius: 8px; font-size: 13px; font-weight: 500; {{projectChipStyle}}">
          <span style="width: 8px; height: 8px; border-radius: 4px; {{project.dotStyle}}"></span>
          {{project.name}}
          <kbd style="font-family: inherit; font-size: 10px; line-height: 14px; padding: 0 4px; border: 1px solid #E6E6EA; border-radius: 3px; color: #6B6B74">P</kbd>
        </button>
        <sc-if value="{{isProject}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 36px; left: 0; z-index: 3; width: 264px; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 10px; box-shadow: 0 12px 32px rgba(24, 24, 27, 0.14); display: flex; flex-direction: column; overflow: hidden">
            <label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-bottom: 1px solid #EFEFF2">
              <span class="sr">Search projects</span>
              <input type="text" placeholder="Move to project…" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; padding: 0">
            </label>
            <div role="listbox" aria-label="Project" style="display: flex; flex-direction: column; padding: 4px">
              <sc-for list="{{projectOptions}}" as="o" hint-placeholder-count="6">
                <button type="button" role="option" aria-selected="{{o.selected}}" class="opt" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 6px; text-align: left; font-size: 13px; {{o.rowStyle}}">
                  <span style="width: 8px; height: 8px; border-radius: 4px; {{o.dotStyle}}"></span>
                  <span style="flex: 1">{{o.name}}</span>
                  <span style="font-size: 12px; color: #6B6B74">{{o.space}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>

      <button type="button" class="chip" aria-label="More fields" style="width: 30px; height: 30px; border: 1px solid #E6E6EA; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#52525B" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
      </button>
    </div>

    <!-- Footer -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px 12px 20px; border-top: 1px solid #EFEFF2">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3F3F46; cursor: pointer">
        <input type="checkbox" checked="{{createMore}}" onChange="{{toggleMore}}" class="sr">
        <span aria-hidden="true" style="width: 28px; height: 16px; border-radius: 8px; padding: 2px; box-sizing: border-box; display: flex; {{switchStyle}}">
          <span style="width: 12px; height: 12px; border-radius: 6px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span>
        </span>
        Create more
      </label>
      <span style="flex: 1"></span>
      <a href="Main.dc.html" class="ghost" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #3F3F46">Cancel</a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 12px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 500">
        Create task
        <kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.2); color: #FFFFFF">⌘ ↵</kbd>
      </a>
    </div>

    <!-- Shortcut hints -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 10px 20px; border-top: 1px solid #EFEFF2; border-radius: 0 0 14px 14px; background: #FAFAFB; font-size: 12px; color: #6B6B74">
      <sc-for list="{{hints}}" as="h" hint-placeholder-count="5">
        <span style="display: flex; align-items: center; gap: 6px">
          <kbd style="font-family: inherit; font-size: 11px; line-height: 16px; padding: 0 5px; min-width: 10px; text-align: center; border: 1px solid #E6E6EA; border-bottom-width: 2px; border-radius: 4px; background: #FFFFFF; color: #3F3F46">{{h.key}}</kbd>{{h.label}}
        </span>
      </sc-for>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E56CF","options":["#6E56CF","#2F6FEB","#0F766E","#3F3F46"]},"openField":{"editor":"enum","default":"assignee","options":["none","assignee","due","project"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: undefined, assignee: 'sara', due: 'tomorrow', project: 'ar', createMore: false };
  }

  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#6E56CF';
    const accentSoft = accent + '1A';
    const open = s.open !== undefined ? s.open : (this.props.openField ?? 'assignee');
    const toggle = (f) => () => this.setState({ open: open === f ? 'none' : f });
    const close = (patch) => this.setState({ ...patch, open: 'none' });

    const people = [
      { id: 'anu', name: 'Anu B.', initials: 'AB', meta: 'You', style: 'background:#E0E7FF;color:#3730A3' },
      { id: 'sara', name: 'Sara K.', initials: 'SK', meta: 'Design', style: 'background:#FFE4E6;color:#9F1239' },
      { id: 'dorj', name: 'Dorj E.', initials: 'DE', meta: 'Frontend', style: 'background:#FEF3C7;color:#92400E' },
      { id: 'tem', name: 'Temuulen G.', initials: 'TG', meta: 'Mobile', style: 'background:#DCFCE7;color:#166534' },
      { id: 'bat', name: 'Bat O.', initials: 'BO', meta: 'Eng lead', style: 'background:#CCFBF1;color:#115E59' },
      { id: 'none', name: 'Unassigned', initials: '–', meta: '', style: 'background:#F4F4F5;color:#6B6B74;border:1px dashed #D4D4D8;box-sizing:border-box' }
    ];
    const dues = [
      { id: 'today', label: 'Today', meta: 'Thu, Oct 8', chip: 'Today' },
      { id: 'tomorrow', label: 'Tomorrow', meta: 'Fri, Oct 9', chip: 'Tomorrow' },
      { id: 'weekend', label: 'This weekend', meta: 'Sat, Oct 10', chip: 'Sat, Oct 10' },
      { id: 'nextweek', label: 'Next week', meta: 'Mon, Oct 12', chip: 'Mon, Oct 12' },
      { id: 'twoweeks', label: 'In two weeks', meta: 'Thu, Oct 22', chip: 'Thu, Oct 22' },
      { id: 'none', label: 'No due date', meta: '', chip: 'Due date' }
    ];
    const projects = [
      { id: 'ar', name: 'App Redesign', space: 'Product', dot: '#7C5CE0' },
      { id: 'co', name: 'Checkout v2', space: 'Product', dot: '#0284C7' },
      { id: 'q4', name: 'Q4 Roadmap', space: 'Product', dot: '#D97706' },
      { id: 'pp', name: 'Partner Portal', space: 'Product', dot: '#A1A1AA' },
      { id: 'mr', name: 'Mobile release 4.2', space: 'Engineering', dot: '#16A34A' },
      { id: 'ds', name: 'Design system', space: 'Design', dot: '#E11D48' }
    ];
    const sel = (on) => on ? 'background:' + accentSoft + ';color:#18181B' : 'background:transparent';
    const chipOn = (on) => on ? 'background:' + accentSoft + ';border-color:' + accent + ';color:#18181B' : 'background:#FFFFFF;color:#3F3F46';

    const assignee = people.find((p) => p.id === s.assignee) || people[1];
    const due = dues.find((d) => d.id === s.due) || dues[1];
    const project = projects.find((p) => p.id === s.project) || projects[0];

    const bgRows = [
      ['Audit current navigation patterns', 'Temuulen G.', 'Oct 14'],
      ['Define color tokens for dark mode', 'Sara K.', 'Oct 16'],
      ['Migration plan for the settings screen', 'Dorj E.', 'Oct 20'],
      ['Usability test script — new onboarding', 'Mia L.', 'Oct 22'],
      ['Empty states for search results', 'Sara K.', 'Oct 23'],
      ['Product card component v2', 'Sara K.', 'Tomorrow'],
      ['Implement new bottom tab bar', 'Temuulen G.', 'Oct 10'],
      ['Redesign onboarding flow (3 screens)', 'Anu B.', 'Oct 12'],
      ['Update analytics events for checkout', 'Oyuka N.', 'Oct 15'],
      ['Accessibility pass on primary buttons', 'Mia L.', 'Oct 7'],
      ['Checkout page — responsive layout', 'Dorj E.', 'Today'],
      ['Icon set refresh (48 icons)', 'Sara K.', 'Oct 13']
    ].map((r) => ({ name: r[0], who: r[1], due: r[2], style: '', markStyle: 'width:14px;height:14px;margin-left:12px;border:1.5px solid #C4C4CC;border-radius:4px;box-sizing:border-box' }));

    return {
      accent, accentSoft, bgRows,
      assignee, due, project,
      isAssignee: open === 'assignee', isDue: open === 'due', isProject: open === 'project',
      openAssignee: toggle('assignee'), openDue: toggle('due'), openProject: toggle('project'),
      assigneeChipStyle: chipOn(open === 'assignee'),
      dueChipStyle: chipOn(open === 'due') + (due.id === 'none' ? ';color:#6B6B74' : ''),
      projectChipStyle: chipOn(open === 'project'),
      assigneeOptions: people.map((p) => ({ ...p, selected: p.id === assignee.id, rowStyle: sel(p.id === assignee.id), pick: () => close({ assignee: p.id }) })),
      dueOptions: dues.map((d) => ({ ...d, selected: d.id === due.id, rowStyle: sel(d.id === due.id), pick: () => close({ due: d.id }) })),
      projectOptions: projects.map((p) => ({ ...p, dotStyle: 'background:' + p.dot, selected: p.id === project.id, rowStyle: sel(p.id === project.id), pick: () => close({ project: p.id }) })),
      createMore: !!s.createMore,
      toggleMore: () => this.setState({ createMore: !this.state.createMore }),
      switchStyle: s.createMore ? 'background:' + accent + ';justify-content:flex-end' : 'background:#D4D4D8;justify-content:flex-start',
      hints: [
        { key: 'A', label: 'Assignee' },
        { key: 'D', label: 'Due date' },
        { key: 'P', label: 'Project' },
        { key: '⌘ ↵', label: 'Create' },
        { key: '⇧ ⌘ ↵', label: 'Create and open' }
      ]
    };
  }
}
</script>
</body>
</html>

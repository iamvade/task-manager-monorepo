services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kite
      POSTGRES_PASSWORD: kite
      POSTGRES_DB: kite
    ports:
      # Local only: the dev credentials are not secret.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kite -d kite && pg_isready -U kite -d kite_test']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional S3-compatible store (SeaweedFS) for STORAGE_DRIVER=s3 and the live S3 storage tests:
  # `docker compose --profile s3 up -d s3`. No identities are configured, so any key works.
  s3:
    image: chrislusf/seaweedfs:3.97
    profiles: ['s3']
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:

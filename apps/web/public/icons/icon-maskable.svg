<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: full bleed, the K kept inside the 80% safe zone (scaled 0.72). -->
  <rect width="512" height="512" fill="#6E56CF"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <clipPath id="cap"><rect x="0" y="136" width="512" height="240"/></clipPath>
    <g clip-path="url(#cap)" stroke="#FFFFFF" stroke-width="46" fill="none">
      <line x1="180" y1="120" x2="180" y2="392"/>
      <line x1="180" y1="292" x2="340" y2="112"/>
      <line x1="232" y1="236" x2="348" y2="400"/>
    </g>
  </g>
</svg>
